<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomCraft AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #preview {
      width: 100%;
      border-radius: 14px;
      margin-top: 20px;
      display: none;
    }

    #download {
      display: none;
      background: #222;
      color: #fff;
      border: 1px solid #555;
    }

    #download:hover {
      background: #333;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RoomCraft AI</h1>

  <div class="subtitle">
    Trasforma una stanza reale mantenendo la sua architettura.
  </div>

  <div class="card">

    <label>Foto della stanza</label>
    <input id="photo" type="file" accept="image/*">

    <label>Stile</label>
    <select id="style">
      <option>Dark European Estate</option>
      <option>Modern Luxury</option>
      <option>Classic European</option>
      <option>Contemporary</option>
      <option>Minimalist</option>
      <option>Industrial</option>
      <option>Japandi</option>
    </select>

    <label>Budget (€)</label>
    <input id="budget" type="number" value="5000">

    <label>Dimensioni della stanza</label>
    <input id="dimensions" type="text" value="4 m × 6.5 m">

    <label>Cosa deve rimanere invariato?</label>
    <textarea id="preserve">Architettura e struttura, scala, pavimento, finestre, porte e televisore.</textarea>

    <label>Cosa vuoi modificare?</label>
    <textarea id="modify">Mobili, illuminazione, tende, tappeto e decorazioni.</textarea>

    <button id="generate">
      Genera il progetto
    </button>

    <div id="status"></div>

    <img id="preview" alt="Progetto RoomCraft">

    <button id="download">
      ⬇️ Scarica immagine
    </button>

  </div>

</div>

<script>

const button = document.getElementById("generate");
const status = document.getElementById("status");
const preview = document.getElementById("preview");
const downloadButton = document.getElementById("download");


/* ==============================
   GENERAZIONE DEL PROGETTO
   ============================== */

button.addEventListener("click", async () => {

  const photo = document.getElementById("photo").files[0];

  if (!photo) {
    status.textContent = "❌ Seleziona prima una foto della stanza.";
    return;
  }

  button.disabled = true;
  downloadButton.style.display = "none";

  status.textContent =
    "⏳ Sto analizzando la stanza e generando il progetto...";

  try {

    const formData = new FormData();

    formData.append("photo", photo);

    formData.append(
      "style",
      document.getElementById("style").value
    );

    formData.append(
      "budget",
      document.getElementById("budget").value
    );

    formData.append(
      "dimensions",
      document.getElementById("dimensions").value
    );

    formData.append(
      "preserve",
      document.getElementById("preserve").value
    );

    formData.append(
      "modify",
      document.getElementById("modify").value
    );


    const response = await fetch("/api/generate", {
      method: "POST",
      body: formData
    });


    const data = await response.json();


    if (!response.ok) {
      throw new Error(
        data.error || "Errore durante la generazione."
      );
    }


    if (!data.image) {
      throw new Error(
        "L'API non ha restituito un'immagine."
      );
    }


    preview.src = data.image;
    preview.style.display = "block";

    downloadButton.style.display = "block";

    status.textContent =
      "✅ Progetto generato.";


  } catch (error) {

    preview.style.display = "none";
    downloadButton.style.display = "none";

    status.textContent =
      "❌ " + error.message;


  } finally {

    button.disabled = false;

  }

});


/* ==============================
   DOWNLOAD IMMAGINE
   ============================== */

downloadButton.addEventListener("click", () => {

  if (!preview.src) {
    return;
  }


  /*
    Proviamo prima il download normale.
  */

  const link = document.createElement("a");

  link.href = preview.src;
  link.download = "roomcraft-progetto.jpg";

  document.body.appendChild(link);

  try {

    link.click();

  } catch (error) {

    console.error(error);

  }

  document.body.removeChild(link);


  /*
    Su alcuni browser/iPhone il download automatico
    di una data URL può non essere supportato.
    Apriamo quindi anche l'immagine in una nuova scheda.
  */

  setTimeout(() => {

    const newWindow = window.open(
      preview.src,
      "_blank"
    );

    if (!newWindow) {

      status.textContent =
        "ℹ️ Tieni premuta l'immagine e scegli «Salva in Foto».";

    } else {

      status.textContent =
        "ℹ️ Se il download non è partito automaticamente, tieni premuta l'immagine e scegli «Salva in Foto».";

    }

  }, 300);

});

</script>

</body>
</html>
